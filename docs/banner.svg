<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="IMGconversor — Optimización de imágenes 100% en el navegador">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" />
      <stop offset="0.55" stop-color="#101D36" />
      <stop offset="1" stop-color="#0B2A5B" />
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="0.55" stop-color="#3B82F6" />
      <stop offset="1" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5E9" />
      <stop offset="0.6" stop-color="#7DD3FC" />
      <stop offset="1" stop-color="#0369A1" />
    </linearGradient>
    <radialGradient id="glow-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55" />
      <stop offset="1" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" />
    </pattern>
    <clipPath id="photo-clip">
      <rect x="16" y="16" width="256" height="108" rx="12" />
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="1280" height="300" rx="24" fill="url(#bg)" />
  <rect width="1280" height="300" rx="24" fill="url(#grid)" />
  <circle cx="1120" cy="40" r="280" fill="url(#glow-blue)" />
  <circle cx="160" cy="320" r="240" fill="url(#glow-cyan)" />

  <!-- Icono -->
  <rect x="64" y="78" width="132" height="132" rx="30" fill="url(#icon)" />
  <rect x="64" y="78" width="132" height="132" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" />
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="92" y="106" width="76" height="76" rx="12" />
    <circle cx="115" cy="129" r="6" fill="#FFFFFF" stroke="none" />
    <path d="M92 164 L112 144 L126 158 L138 146 L168 176" />
  </g>

  <!-- Texto -->
  <text id="banner-title" x="232" y="141" font-family="Inter, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">IMG</tspan><tspan fill="#7DD3FC">conversor</tspan>
  </text>
  <text id="banner-subtitle" x="234" y="185" font-family="Inter, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">
    Convierte, redimensiona y comprime imágenes en tu navegador.
  </text>

  <!-- Etiquetas -->
  <g font-family="Inter, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#DBEAFE">
    <rect x="234" y="216" width="154" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="311" y="238" text-anchor="middle">WEBP · PNG · JPG</text>

    <rect x="400" y="216" width="138" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="469" y="238" text-anchor="middle">SIN SUBIDAS</text>

    <rect x="550" y="216" width="152" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="626" y="238" text-anchor="middle">100% LOCAL</text>
  </g>

  <!-- Tarjeta de ejemplo -->
  <g transform="translate(916 64)">
    <rect width="288" height="172" rx="18" fill="#0B1220" fill-opacity="0.88" stroke="#93C5FD" stroke-opacity="0.18" />
    <g clip-path="url(#photo-clip)">
      <rect x="16" y="16" width="256" height="108" fill="url(#photo)" />
      <circle cx="222" cy="48" r="14" fill="#FEF3C7" opacity="0.95" />
      <path d="M16 124 L78 70 L120 106 L162 74 L272 124 Z" fill="#0F172A" opacity="0.65" />
      <path d="M16 124 L96 92 L142 116 L190 96 L272 124 Z" fill="#0B1220" opacity="0.78" />
      <path d="M16 118 H272 V124 H16 Z" fill="#67E8F9" opacity="0.35" />
    </g>
    <text x="16" y="151" font-family="Inter, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">fotografia-urbana.jpg</text>
    <rect x="212" y="136" width="60" height="22" rx="11" fill="#052E16" stroke="#22C55E" stroke-opacity="0.35" />
    <text x="242" y="151" text-anchor="middle" font-family="Inter, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4ADE80">WEBP</text>
  </g>

  <!-- Insignia de ahorro -->
  <g transform="translate(1164 42)">
    <rect width="84" height="38" rx="19" fill="#052E16" stroke="#22C55E" stroke-opacity="0.4" />
    <text x="42" y="25" text-anchor="middle" font-family="Inter, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4ADE80">↓ 58%</text>
  </g>
</svg>
