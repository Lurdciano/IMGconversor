<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="112" y="144" width="288" height="224" rx="48" />
    </clipPath>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect x="7" y="7" width="498" height="498" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="7" />

  <!-- Photo Card Shadow & Fill -->
  <rect x="112" y="144" width="288" height="224" rx="48" fill="#0B132B" fill-opacity="0.35" />

  <!-- Photo Content (Clipped) -->
  <g clip-path="url(#card-clip)">
    <!-- Sun -->
    <circle cx="176" cy="208" r="26" fill="#FACC15" />
    <!-- Rear Mountain Peak (Cyan) -->
    <polygon points="208,358 280,258 352,358" fill="#38BDF8" />
    <!-- Front Mountain Peak (White) -->
    <polygon points="128,358 200,234 280,358" fill="#FFFFFF" />
  </g>

  <!-- Photo Card Border -->
  <rect x="112" y="144" width="288" height="224" rx="48" fill="none" stroke="#FFFFFF" stroke-width="19" />

  <!-- Dynamic Circular Conversion Arrows -->
  <!-- Top Arrow (Clockwise, curving over card) -->
  <path d="M 130 92 Q 256 46 362 76" fill="none" stroke="url(#arrow-grad)" stroke-width="23" stroke-linecap="round" />
  <polygon points="392,102 346,58 360,118" fill="#FFFFFF" />

  <!-- Bottom Arrow (Clockwise, curving under card) -->
  <path d="M 382 420 Q 256 466 150 436" fill="none" stroke="url(#arrow-grad)" stroke-width="23" stroke-linecap="round" />
  <polygon points="120,410 166,454 152,394" fill="#FFFFFF" />
</svg>
